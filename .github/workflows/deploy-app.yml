name: Deploy Application

on:
  workflow_dispatch:
  # Also run after infra deploys successfully, to handle the case where both workflows are triggered simultaneously by the same commit.
  workflow_run:
    workflows: ["Deploy Infrastructure"]
    types: [completed]
  push:
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/deploy-app.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/deploy-app.yml'

concurrency:
  group: deploy-app-${{ github.ref }}

  # Only cancel in-progress runs for non-main branches
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RESOURCE_GROUP: Hitachi-RG
  LOCATION: eastus

jobs:
  validate:
    name: Validate Docker Build (PRs only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        run: docker build -t hitachi-app:pr-${{ github.sha }} .

  build-and-push:
    name: Build and Push Docker Image
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # When triggered by workflow_run, check out the commit that triggered
          # the infra workflow rather than defaulting to the main branch HEAD.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve ACR login server
        id: acr
        run: |
          LOGIN_SERVER=$(az deployment group list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[?properties.outputs.acrLoginServer.value!=null] | sort_by(@, &properties.timestamp)[-1].properties.outputs.acrLoginServer.value" \
            -o tsv)
          ACR_NAME="${LOGIN_SERVER%%.azurecr.io}"

          if [ -z "$LOGIN_SERVER" ] || [ -z "$ACR_NAME" ]; then
            echo "Unable to resolve ACR from deployment outputs." >&2
            exit 1
          fi

          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"

      - name: ACR Login
        run: az acr login --name "${{ steps.acr.outputs.acr_name }}"

      - name: Build and push image
        run: |
          IMAGE="${{ steps.acr.outputs.login_server }}/hitachi-app:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          docker tag "$IMAGE" "${{ steps.acr.outputs.login_server }}/hitachi-app:latest"
          docker push "${{ steps.acr.outputs.login_server }}/hitachi-app:latest"

      - name: Deploy Container App Job
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: ./infra/main.bicep
          parameters: >-
            location=${{ env.LOCATION }}
            deployContainerJob=true
            jobImage=${{ steps.acr.outputs.login_server }}/hitachi-app:${{ github.sha }}
