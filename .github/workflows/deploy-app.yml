name: Deploy Application

on:
  workflow_dispatch:
  # Run after infra deploys successfully. When both infra and src change in the same commit,
  # the push-triggered build-and-push job is skipped (infra-changed == true) and this
  # workflow_run trigger ensures the app is deployed once infra has finished.
  # Branch filter prevents this from firing on infra PR test runs (where no actual deploy occurred).
  workflow_run:
    workflows: ["Deploy Infrastructure"]
    types: [completed]
    branches: [main, development, infrastructure]
  push:
    branches: [infrastructure, development, main]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/deploy-app.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/deploy-app.yml'

concurrency:
  group: deploy-app-${{ github.ref }}

  # Only cancel in-progress runs for non-main branches
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RESOURCE_GROUP: Hitachi-RG
  LOCATION: eastus

jobs:
  validate:
    name: Validate Docker Build (PRs only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        run: docker build -t hitachi-app:pr-${{ github.sha }} .

  check-paths:
    name: Detect Changed Paths
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      infra-changed: ${{ steps.check.outputs.infra-changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check if infra files changed
        id: check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^infra/'; then
            echo "infra-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra-changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build and Push Docker Image
    needs: [check-paths]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'push' && needs.check-paths.outputs.infra-changed == 'false')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # When triggered by workflow_run, check out the commit that triggered
          # the infra workflow rather than defaulting to the main branch HEAD.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve ACR login server
        id: acr
        run: |
          # Primary: query the ACR resource directly — works even if no deployment output exists yet
          LOGIN_SERVER=$(az acr list \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "[0].loginServer" \
            -o tsv 2>/dev/null || true)

          # Fallback: derive from the most recent deployment that emitted acrLoginServer
          if [ -z "$LOGIN_SERVER" ]; then
            LOGIN_SERVER=$(az deployment group list \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query "[?properties.outputs.acrLoginServer.value!=null] | sort_by(@, &properties.timestamp)[-1].properties.outputs.acrLoginServer.value" \
              -o tsv 2>/dev/null || true)
          fi

          ACR_NAME="${LOGIN_SERVER%%.azurecr.io}"

          if [ -z "$LOGIN_SERVER" ] || [ -z "$ACR_NAME" ]; then
            echo "Unable to resolve ACR login server from either 'az acr list' or deployment outputs." >&2
            echo "Ensure the infrastructure has been deployed to resource group ${{ env.RESOURCE_GROUP }} first." >&2
            exit 1
          fi

          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"

      - name: ACR Login
        run: az acr login --name "${{ steps.acr.outputs.acr_name }}"

      - name: Build and push image
        run: |
          IMAGE="${{ steps.acr.outputs.login_server }}/hitachi-app:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          docker tag "$IMAGE" "${{ steps.acr.outputs.login_server }}/hitachi-app:latest"
          docker push "${{ steps.acr.outputs.login_server }}/hitachi-app:latest"

      - name: Deploy Container App Job
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: ./infra/main.bicep
          parameters: >-
            location=${{ env.LOCATION }}
            deployContainerJob=true
            jobImage=${{ steps.acr.outputs.login_server }}/hitachi-app:${{ github.sha }}
