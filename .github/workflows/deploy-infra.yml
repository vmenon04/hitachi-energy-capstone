name: Deploy Infrastructure

on:
  workflow_dispatch:
  # all pushes into the 'infrastructure' branch will deploy
  push:
    branches: [ infrastructure, development, main ]
    paths: ['infra/**']
  pull_request:
    branches: [ development, main ]
    paths: ['infra/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # the What-If Preview prints logs for us so we can check if a deployment fails
      - name: What-If Preview
        run: |
          az deployment group what-if \
            --resource-group Hitachi-RG \
            --template-file infra/main.bicep \
            --parameters location=eastus

      - name: Deploy to Azure
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: -RG
          template: ./infra/main.bicep
          parameters: location=eastus