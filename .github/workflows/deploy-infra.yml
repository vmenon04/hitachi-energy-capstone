name: Deploy Infrastructure

on:
  workflow_dispatch:
  # all pushes into the 'infrastructure' branch will deploy
  push:
    branches: [ infrastructure, development, main ]
    paths: 
      - 'infra/**'
      - 'tests/test_bicep.py'
      - '.github/workflows/deploy-infra.yml'
  pull_request:
    branches: [ development, main ]
    paths: 
      - 'infra/**'
      - 'tests/test_bicep.py'
      - '.github/workflows/deploy-infra.yml'

concurrency:
  group: deploy-infra-${{ github.ref }}
  cancel-in-progress: true

env:
  RESOURCE_GROUP: Hitachi-RG
  LOCATION: eastus

jobs:
  test:
    runs-on: ubuntu-latest
    name: Validate Bicep Templates
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Azure CLI and Bicep
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          az bicep install

      - name: Run Bicep tests
        run: |
          pytest tests/test_bicep.py -v --tb=short

  deploy:
    name: Deploy Resources to Azure
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # the What-If Preview prints logs for us so we can check if a deployment fails
      - name: What-If Preview
        run: |
          az deployment group what-if \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters location=${{ env.LOCATION }}

      # - name: Resolve ACR login server
      #   id: acr
      #   run: |
      #     LOGIN_SERVER=$(az deployment group list \
      #       --resource-group ${{ env.RESOURCE_GROUP }} \
      #       --query "[?properties.outputs.acrLoginServer.value!=null] | sort_by(@, &properties.timestamp)[-1].properties.outputs.acrLoginServer.value" \
      #       -o tsv)
      #     ACR_NAME="${LOGIN_SERVER%%.*}"

      #     if [ -z "$LOGIN_SERVER" ] || [ -z "$ACR_NAME" ]; then
      #       echo "Unable to resolve ACR from deployment outputs." >&2
      #       exit 1
      #     fi

      #     echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"
      #     echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"

      # - name: ACR Login
      #   run: az acr login --name "${{ steps.acr.outputs.acr_name }}"

      # - name: Build and push image
      #   run: |
      #     IMAGE="${{ steps.acr.outputs.login_server }}/hitachi-app:${{ github.sha }}"
      #     docker build -t "$IMAGE" .
      #     docker push "$IMAGE"
      #     docker tag "$IMAGE" "${{ steps.acr.outputs.login_server }}/hitachi-app:latest"
      #     docker push "${{ steps.acr.outputs.login_server }}/hitachi-app:latest"

      - name: Deploy to Azure
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: ./infra/main.bicep
          parameters: location=${{ env.LOCATION }}