name: Deploy Infrastructure

on:
  workflow_dispatch:
  # all pushes into the 'infrastructure' branch will deploy
  push:
    branches: [ infrastructure, development, main ]
    paths: 
      - 'infra/**'
      - 'tests/test_bicep.py'
      - '.github/workflows/deploy-infra.yml'
  pull_request:
    branches: [ development, main ]
    paths: 
      - 'infra/**'
      - 'tests/test_bicep.py'
      - '.github/workflows/deploy-infra.yml'

concurrency:
  group: deploy-infra-${{ github.ref }}

  # Only cancel in-progress runs for non-main branches
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RESOURCE_GROUP: Hitachi-RG
  LOCATION: eastus

jobs:
  test:
    runs-on: ubuntu-latest
    name: Validate Bicep Templates
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Azure CLI and Bicep
        run: az bicep install

      - name: Run Bicep tests
        run: |
          pytest tests/test_bicep.py -v --tb=short

  deploy:
    name: Deploy Resources to Azure
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # What-If preview - prints a diff of what will change before deploying
      - name: What-If Preview
        run: |
          az deployment group what-if \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters location=${{ env.LOCATION }} deployContainerJob=false

      - name: Deploy Core Infrastructure
        id: deploy
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: ./infra/main.bicep
          parameters: location=${{ env.LOCATION }} deployContainerJob=false

      - name: Assign Key Vault Secrets User role to managed identity
        run: |
          KV_NAME=$(az keyvault list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[0].name" -o tsv)
          MI_PRINCIPAL_ID="${{ steps.deploy.outputs.managedIdentityPrincipalId }}"
          KV_SCOPE="/subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/${{ env.RESOURCE_GROUP }}/providers/Microsoft.KeyVault/vaults/$KV_NAME"

          EXISTING=$(az role assignment list \
            --role "Key Vault Secrets User" \
            --assignee "$MI_PRINCIPAL_ID" \
            --scope "$KV_SCOPE" \
            --query "[0].id" -o tsv 2>/dev/null || true)

          if [ -z "$EXISTING" ]; then
            az role assignment create \
              --role "Key Vault Secrets User" \
              --assignee-object-id "$MI_PRINCIPAL_ID" \
              --assignee-principal-type ServicePrincipal \
              --scope "$KV_SCOPE"
          else
            echo "Role assignment already exists, skipping."
          fi