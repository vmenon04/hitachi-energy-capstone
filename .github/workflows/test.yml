# Runs unit tests on feature branch pushes and PRs.
# The full test suite is handled exclusively by deploy.yml on development, main, and infrastructure.
 
name: Run Unit Tests
 
on:
  push:
    branches-ignore: [development, main, infrastructure]
  pull_request:
    branches: [development, main]
 
jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
 
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
 
      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short
