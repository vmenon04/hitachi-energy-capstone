# Runs unit tests on feature branch pushes and PRs.
# The full test suite is handled exclusively by deploy.yml on development, main, and infrastructure.

name: Run Unit Tests
 
on:
  push:
    branches-ignore: [development, main, infrastructure]
  pull_request:
    branches: [development, main]

permissions:
  contents: read
  pull-requests: write
 
jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
 
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
 
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
 
      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short --cov=src --cov-report=xml

      - name: Build coverage table
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse("coverage.xml").getroot()

          files = []
          for cls in root.findall(".//class"):
            filename = cls.attrib.get("filename", "")
            line_rate = float(cls.attrib.get("line-rate", "0"))
            files.append((filename, line_rate))

          merged = {}
          for filename, rate in files:
            merged[filename] = max(rate, merged.get(filename, 0.0))

          rows = sorted(merged.items(), key=lambda x: x[0].lower())

          total_rate = float(root.attrib.get("line-rate", "0"))
          total_pct = f"{total_rate * 100:.1f}%"

          lines = []
          lines.append("### Coverage Table")
          lines.append("")
          lines.append(f"**Total line coverage:** {total_pct}")
          lines.append("")
          lines.append("| File | Line Coverage |")
          lines.append("|---|---:|")

          for filename, rate in rows:
            lines.append(f"| `{filename}` | {rate * 100:.1f}% |")

          Path("coverage-table.md").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Post coverage comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('coverage-table.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
    